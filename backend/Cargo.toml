[package]
name = "omakindle-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Plugin-owned read-only read.amazon.com client for the Omarchy Kindle plugin"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.24"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wreq = { version = "0.16", features = ["cookies", "gzip", "brotli", "deflate", "zstd"] }
wreq-util = "0.2"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
